on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      # guard: never publish a tarball without the built dist files (see v3.13.0)
      - run: |
          npm pack --dry-run --json | node -e "
            const json = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const pkg = Array.isArray(json) ? json[0] : Object.values(json)[0];
            const files = pkg.files.map(f => f.path);
            const required = ['dist/index.js', 'dist/index.mjs', 'dist/index.d.ts'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('Tarball is missing:', missing.join(', ')); process.exit(1); }
            console.log('Tarball OK:', files.join(', '));
          "
      - run: npm publish
